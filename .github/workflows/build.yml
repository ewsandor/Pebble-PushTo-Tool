name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  APPSTORE_API_BASE: https://appstore-api.repebble.com

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      platforms: ${{ steps.meta.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-pebble

      - name: Build
        run: pebble build

      - name: Read version
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "platforms=$(node -p "JSON.stringify(require('./package.json').pebble.targetPlatforms)")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${{ steps.meta.outputs.version }}" >&2
            exit 1
          fi

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/*.pbw "dist/Pebble-PushTo-Tool-${{ steps.meta.outputs.version }}.pbw"

      - name: Build debug mode (not published)
        run: pebble build -- --mode=debug

      - name: Verify release and debug package identities
        run: |
          python3 - <<'PY'
          import glob
          import json
          import zipfile

          with open("package.json", encoding="utf-8") as package_file:
              project = json.load(package_file)["pebble"]
          release_uuid = project["uuid"]
          release_name = project["displayName"]
          debug_uuid = "7a86959b-99d5-4c48-b075-9ae23c165744"

          def appinfo_from(pattern):
              paths = glob.glob(pattern)
              if len(paths) != 1:
                  raise SystemExit(f"Expected one PBW at {pattern}, found {len(paths)}")
              with zipfile.ZipFile(paths[0]) as pbw:
                  return json.loads(pbw.read("appinfo.json"))

          release = appinfo_from("dist/*.pbw")
          debug = appinfo_from("build/*.pbw")
          for field in ("uuid", "shortName", "longName", "displayName"):
              if release[field] != (release_uuid if field == "uuid" else release_name):
                  raise SystemExit(f"Release {field} is incorrect: {release[field]}")
              expected = debug_uuid if field == "uuid" else f"{release_name} Debug"
              if debug[field] != expected:
                  raise SystemExit(f"Debug {field} is incorrect: {debug[field]}")
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: pbw-release
          path: dist/*.pbw
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: pbw-debug
          path: build/*.pbw
          if-no-files-found: error

  host-tests:
    name: Host tests (native C, Python, Node.js)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Host C tests
        run: make -C test/astro
      - name: Tool tests
        run: python3 -m unittest discover -s test/tools -v
      - name: Companion tests
        run: node test/pkjs/companion.test.js
      - name: Install emulator test dependencies
        run: python3 -m pip install -r test/emulator/requirements.txt
      - name: Emulator runner tests
        run: |
          make -C test/astro references
          python3 -m unittest discover -s test/emulator -v

  sanity-emulator:
    needs: [build, host-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.build.outputs.platforms) }}
        mode: [release, debug]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pebble
      - run: python3 -m pip install -r test/emulator/requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: pbw-${{ matrix.mode }}
          path: dist
      - name: Initialize emulator
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          pebble emu-set-location --emulator "$PLATFORM" --vnc 40 -105
          reply=$(printf '%s\n' 'pebble.send_and_read(protocol.AppRunState(data=protocol.AppRunStateRequest()), protocol.AppRunState, timeout=15); print("TEST_WATCH_READY")' | pebble repl --emulator "$PLATFORM" --vnc)
          printf '%s\n' "$reply"
          printf '%s\n' "$reply" | grep -qx 'TEST_WATCH_READY'
      - name: Sanity emulator suite
        run: |
          python3 test/emulator/run.py --tier sanity --mode "${{ matrix.mode }}" \
            --platform "${{ matrix.platform }}" --pbw "$(find dist -name '*.pbw')" \
            --output test-results
      - name: Ensure a final sanity report exists
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path("test-results/summary.json")
          if not report.exists():
              report.parent.mkdir(parents=True, exist_ok=True)
              report.write_text(json.dumps({"tier": "sanity", "success": False,
                  "error": "Suite did not start; inspect workflow setup logs"}) + "\n")
          PY
      - name: Upload sanity reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanity-${{ matrix.mode }}-${{ matrix.platform }}
          path: test-results/
          if-no-files-found: error

  # Stable required status for branch protection, including merge queues.
  sanity:
    if: always()
    needs: [build, host-tests, sanity-emulator]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every sanity matrix entry
        env:
          BUILD: ${{ needs.build.result }}
          HOST: ${{ needs.host-tests.result }}
          EMULATOR: ${{ needs.sanity-emulator.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          checks = {name.lower(): os.environ[name] for name in ("BUILD", "HOST", "EMULATOR")}
          passed = all(result == "success" for result in checks.values())
          Path("sanity-report.json").write_text(json.dumps({
              "tier": "sanity", "success": passed, "checks": checks}, indent=2) + "\n")
          if not passed:
              raise SystemExit("Sanity requires successful build, host tests, and every emulator")
          PY
      - name: Upload final sanity gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sanity-report
          path: sanity-report.json
          if-no-files-found: error

  # Create the GitHub release and attach its PBW before the release test gate.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pbw-release
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.pbw
          generate_release_notes: true

  comprehensive:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Comprehensive (${{ matrix.platform }}, ${{ matrix.group }})
    needs: [build, host-tests, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.build.outputs.platforms) }}
        group: [pointing, clock, navigation, weather, display, filters]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pebble
      - run: python3 -m pip install -r test/emulator/requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: pbw-release
          path: dist
      - name: Initialize emulator
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          pebble emu-set-location --emulator "$PLATFORM" --vnc 40 -105
          reply=$(printf '%s\n' 'pebble.send_and_read(protocol.AppRunState(data=protocol.AppRunStateRequest()), protocol.AppRunState, timeout=15); print("TEST_WATCH_READY")' | pebble repl --emulator "$PLATFORM" --vnc)
          printf '%s\n' "$reply"
          printf '%s\n' "$reply" | grep -qx 'TEST_WATCH_READY'
      - name: Comprehensive release emulator suite
        run: |
          python3 test/emulator/run.py --tier comprehensive --mode release \
            --platform "${{ matrix.platform }}" --pbw "$(find dist -name '*.pbw')" \
            --group "${{ matrix.group }}" \
            --output test-results
      - name: Ensure a final comprehensive report exists
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          GROUP: ${{ matrix.group }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path("test-results/summary.json")
          if not report.exists():
              report.parent.mkdir(parents=True, exist_ok=True)
              report.write_text(json.dumps({"tier": "comprehensive", "success": False,
                  "platforms": [os.environ["PLATFORM"]], "groups": [os.environ["GROUP"]],
                  "error": "Suite did not start; inspect workflow setup logs"}) + "\n")
          PY
      - name: Upload comprehensive reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: comprehensive-release-${{ matrix.platform }}-${{ matrix.group }}
          path: test-results/
          if-no-files-found: error

  comprehensive-gate:
    if: always() && !cancelled() && github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, host-tests, release, sanity, comprehensive]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the comprehensive release gate
        env:
          BUILD: ${{ needs.build.result }}
          HOST: ${{ needs.host-tests.result }}
          RELEASE: ${{ needs.release.result }}
          SANITY: ${{ needs.sanity.result }}
          EMULATOR: ${{ needs.comprehensive.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          checks = {name.lower(): os.environ[name] for name in ("BUILD", "HOST", "RELEASE", "SANITY", "EMULATOR")}
          passed = all(result == "success" for result in checks.values())
          Path("comprehensive-report.json").write_text(json.dumps({
              "tier": "comprehensive", "success": passed, "checks": checks}, indent=2) + "\n")
          if not passed:
              raise SystemExit("Store assets require a successful release, host tests, release/debug sanity, and every emulator category")
          PY
      - name: Upload final comprehensive gate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: comprehensive-report
          path: comprehensive-report.json
          if-no-files-found: error
  store-screenshots:
    needs: [build, release, comprehensive-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.build.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pebble
      - run: python3 -m pip install -r test/emulator/requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: pbw-release
          path: dist
      - name: Set emulator phone location
        run: pebble emu-set-location --emulator "${{ matrix.platform }}" --vnc 51.4779 0
      - name: Capture store listing candidates
        run: |
          python3 test/emulator/store_screenshots.py --platform "${{ matrix.platform }}" \
            --pbw "dist/Pebble-PushTo-Tool-${{ needs.build.outputs.version }}.pbw" --output store-screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v6
        with:
          name: store-screenshots-${{ matrix.platform }}
          path: store-screenshots/${{ matrix.platform }}/*.png
          if-no-files-found: error
      - name: Upload capture logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: store-screenshot-logs-${{ matrix.platform }}
          path: store-screenshots/logs/
          if-no-files-found: warn

  publish:
    needs: [build, release, comprehensive-gate, store-screenshots]
    runs-on: ubuntu-24.04
    environment: Pebble Appstore
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.publish.outcome }}
      stage: ${{ steps.publish.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: pbw-release
          path: dist
      - name: Publish to Pebble App Store
        id: publish
        continue-on-error: true
        env:
          APP_ID: ${{ vars.APPSTORE_APP_ID }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          echo "stage=configuration" >> "$GITHUB_OUTPUT"
          test -n "$APP_ID" || { echo "APPSTORE_APP_ID is not configured" >&2; exit 1; }
          UUID=$(jq -er '.pebble.uuid | select(type == "string" and length > 0) | ascii_downcase' package.json)
          echo "stage=authentication" >> "$GITHUB_OUTPUT"
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$APPSTORE_API_BASE" | jq -er '.value | select(type == "string" and length > 0)')
          echo "::add-mask::$TOKEN"
          echo "stage=listing" >> "$GITHUB_OUTPUT"
          APP=$(curl -fsS -H "Authorization: Bearer ""$TOKEN" "$APPSTORE_API_BASE/api/v1/developer/me" | \
            jq -ce --arg uuid "$UUID" '
              [.apps[] | select((.app_uuid // "" | ascii_downcase) == $uuid)] |
              if length == 1 then .[0] else error("Expected one App Store listing for the app UUID") end |
              if (.app_id | type == "string" and length > 0) and
                 (.versions | type == "array" and all(.[]; type == "string"))
              then . else error("App Store response is missing an app ID or versions") end')
          test "$(jq -r '.app_id' <<<"$APP")" = "$APP_ID" || { echo "APPSTORE_APP_ID does not match the app UUID" >&2; exit 1; }
          if jq -e --arg version "$VERSION" '.versions | index($version) != null' <<<"$APP" >/dev/null; then
            echo "Version $VERSION already exists in the App Store."
            exit 0
          fi
          echo "stage=upload" >> "$GITHUB_OUTPUT"
          curl -fsS -H "Authorization: Bearer ""$TOKEN" \
            --form-string "version=$VERSION" \
            -F "pbwFile=@dist/Pebble-PushTo-Tool-$VERSION.pbw" \
            --form-string isPublished=true \
            "$APPSTORE_API_BASE/api/dashboard/apps/$APP_ID/releases"
      - name: Warn about manual publishing
        if: steps.publish.outcome == 'failure'
        run: echo "::warning::Pebble App Store publication failed; a manual publishing issue will be created."

  manual-publishing-issue:
    if: always() && !cancelled() && needs.build.result == 'success' && needs.comprehensive-gate.result == 'success' && needs.store-screenshots.result == 'success' && needs.publish.outputs.outcome == 'failure'
    needs: [build, comprehensive-gate, store-screenshots, publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Create or update manual publishing issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          FAILURE_STAGE: ${{ needs.publish.outputs.stage }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]+)?$ ]] || { echo "Invalid version" >&2; exit 1; }
          title="Publish PushTo Tool v$VERSION"
          gh release view "v$VERSION" --repo "$GH_REPO" --json url,body > release.json
          release_url=$(jq -er '.url | select(type == "string" and length > 0)' release.json)
          jq -er '.body | select(type == "string")' release.json > release-notes.md
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name == "pbw-release" or .name == "comprehensive-report" or (.name | startswith("comprehensive-release-")) or (.name | startswith("store-screenshots-"))) | [.name, (.id | tostring)] | @tsv' > artifacts.tsv
          {
            printf 'Automatic Pebble App Store publication failed during **%s**. [View the workflow run](%s).\n\n' "$FAILURE_STAGE" "$RUN_URL"
            printf '[GitHub release v%s](%s)\n\n' "$VERSION" "$release_url"
            printf '### Manual publishing\n\n'
            printf '%s\n' '- [ ] Review the comprehensive test reports and screenshots.' \
              '- [ ] Download the release PBW and publish it in the Pebble Developer Dashboard.' \
              '- [ ] Copy the release notes below into the Pebble App Store release notes.' \
              '- [ ] Upload the desired screenshots and verify the store listing.' \
              '- [ ] Close this issue once publication is complete.'
            printf '\n### Release notes\n\nCopy the following release notes when manually publishing:\n\n'
            sed 's/^/> /' release-notes.md
            printf '\n### Workflow artifacts\n\n'
            while IFS=$'\t' read -r name id; do
              printf -- '- [%s](%s/artifacts/%s)\n' "$name" "$RUN_URL" "$id"
            done < artifacts.tsv
            printf '\nArtifact links expire according to GitHub Actions retention settings.\n'
          } > issue.md
          existing=$(gh issue list --state all --search "\"$title\" in:title" --limit 1000 --json number,title,state \
            | jq -c --arg title "$title" '[.[] | select(.title == $title)] | first // empty')
          if [ -n "$existing" ]; then
            number=$(jq -r '.number' <<<"$existing")
            gh issue comment "$number" --body-file issue.md
            gh issue edit "$number" --add-assignee ewsandor
            if [ "$(jq -r '.state' <<<"$existing")" = "CLOSED" ]; then
              gh issue reopen "$number"
            fi
          else
            gh issue create --title "$title" --body-file issue.md --assignee ewsandor
          fi
