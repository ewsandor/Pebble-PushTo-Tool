name: Copilot Setup Steps

# Keep the toolchain below in sync with .github/actions/setup-pebble/action.yml.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  # The job must be named copilot-setup-steps for Copilot to use it.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # pebble-tool supports Python 3.10-3.13

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libglib2.0-0t64 libpixman-1-0 zlib1g libsndio7.0 libpng16-16t64

      - uses: astral-sh/setup-uv@v7

      - name: Install pebble tool
        run: uv tool install pebble-tool==5.2.0

      - name: Set Pebble SDK version
        id: sdk_version
        run: echo "version=4.44" >> "$GITHUB_OUTPUT"

      - name: Cache Pebble SDK
        id: sdk_cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pebble-sdk
          key: pebble-sdk-${{ runner.os }}-${{ steps.sdk_version.outputs.version }}

      - name: Install Pebble SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        env:
          PEBBLE_SDK_VERSION: ${{ steps.sdk_version.outputs.version }}
        run: |
          if [ -f "$HOME/.local/share/pebble-sdk/SDKs/$PEBBLE_SDK_VERSION/sdk-core/manifest.json" ]; then
            echo "Pebble SDK $PEBBLE_SDK_VERSION already installed"
          else
            pebble sdk install "$PEBBLE_SDK_VERSION"
          fi

      - name: Install npm dependencies
        run: npm ci
